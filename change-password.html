<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change password · nearby</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body data-page="change">

  <a href="#main" class="skip-link">Skip to main</a>

  <div class="auth-wrap">
    <main class="auth-box" id="main">
      <div class="auth-top">
        <!-- svg here -->
      </div>
      <div class="auth-card">
        <h1>Change your password</h1>
        <p class="lead">choose a strong password you have not used before</p>
<div class="alert" id="alert" role="alert" tabindex="-1" hidden></div>
<form class="form-stack" novalidate data-form id="change-form">
<div class="field">

  <label for="current">Current Password</label>
  <div class="pw">
    <input type="password" name="current" id="current" autocomplete="current-password" aria-describedby="current-err letter-label">
    <button type="button" data-toggle-pw="current" aria-pressed="false" aria-label="show or hide current password">show</button>
  </div>

  <span class="err" id="current-err" role="alert"></span>
</div>

<div class="field">
  <label for="password">New Password</label>
  <div class="pw">
    <input type="password" name="password" id="password" autocomplete="new-password" aria-describedby="password-err letter-label" data-meter>
    <button type="button" data-toggle-pw="password" aria-pressed="false" aria-label="show or hide new password">show</button>
  </div>

  <div class="meter" aria-hidden="true">
    <span id="meter-bar"></span>
  </div>

  <p class="meter-label" id="meter-label" aria-live="polite"></p>

  <p class="hint">at least 8 characters, with a letter and number</p>
  <span class="err" id="password-err" role="alert"></span>
</div>

<div class="field">
  <label for="confirm">Confirm New Password</label>
  <div class="pw">
    <input type="password" name="confirm" id="confirm" autocomplete="new-password" aria-describedby="confirm-err letter-label" data-meter>
    <button type="button" data-toggle-pw="confirm" aria-pressed="false" aria-label="show or hide confirm password">show</button>
  </div>

  <span class="err" id="confirm-err" role="alert"></span>
</div>

<button class="submit" type="submit">Update Password</button>
</form>
      </div>
    </main>
  </div>
</body>
</html>
