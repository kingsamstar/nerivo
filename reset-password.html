<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password· nerivo</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body data-page="reset">

  <a href="#main" class="skip-link">Skip to main</a>

  <div class="auth-wrap">
    <main class="auth-box" id="main">
<div class="auth-top">
    <!-- svg here -->
</div>

<div class="auth-card">

    <div id="form-view">
        <h1>Set a new password</h1>
        <p class="lead">choose a strong password you have not used  before</p>

        <div class="alart" id="alart" role="alart" tabIndex="-1" hidden></div>

        <form class="form-stack" novalidate data-form>

            <div class="field">
                <label for="password">New Password</label>

                <div class="pw">
<input type="password" name="password" id="password" autocomplete="new-password" aria-describedby="password-err leter-label" data-meter>
<button type="button" data-toggle-pw="password" aria-pressed="false" aria-label="show or hide new password">show</button>

                </div>

                <div class="meter" aria-hidden="true">
                    <span id="meter-bar"></span>
                </div>

                <p class="meter-label" id="meter-label" aria-live="polite"></p>

                <p class="hint">at list 8 characters, with a letter and number</p>
                <span class="err" id="password-err" role="alart"></span>
            </div>

            <div class="field">
                <label for="confirm">Confirm Password</label>

                <div class="pw">
<input type="password" name="confirm" id="confirm" autocomplete="new-password" aria-describedby="confirm-err letter-label" data-meter>
<button type="button" data-toggle-pw="confirm" aria-pressed="false" aria-label="show or hide confirm password">show</button>
                </div>

                <span class="err" id="confirm-err" role="alart"></span>
            </div>
<button class="submit" type="submit">Reset Password</button>

        </form>
    </div>
</div>
    </main>
  </div>
</body>
</html>
