<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password · nerivo</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body data-page="forgot">

  <a href="#main" class="skip-link">Skip to main</a>

  <div class="auth-wrap">
    <main class="auth-box" id="main">

      <div class="auth-top">
        <a href="index.html" class="brand">
          <!-- svg here for brand -->
        </a>
      </div>

      <div class="auth-card">
        <div id="form-view">
          <h1>Forgot your password?</h1>
          <p class="lead">Enter your email address and we'll send you a link to reset your password.</p>

          <div class="alert" id="alert" role="alert" tabindex="-1" hidden></div>

          <form class="form-stack" data-form novalidate>

            <div class="field">
              <label for="email">Email</label>
              <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
              <span class="err" id="email-err" role="alert"></span>
            </div>
<button class="submit" type="submit">Send reset link</button>

          </form>

          <div class="success" id="done-view" hidden tabindex="-1">
            <h1>Check your email</h1>
            <p class="lead">If an account with that email exists, we've sent you a link to reset your password.</p>
          </div>

          <p class="foot">Remember your password? <a href="login.html">Sign in</a></p>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
